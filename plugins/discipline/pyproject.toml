[project]
name = "discipline"
dynamic = ["version"]
description = "Gate checks and review-loop bookkeeping for the Chaordic working method (the discipline Claude Code plugin)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Chaordic" }]
dependencies = []

[project.urls]
Repository = "https://github.com/chaordic-io/discipline"

[project.scripts]
discipline = "discipline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/discipline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/discipline"]

# The plugin's agents and skills travel inside the wheel, so `discipline init`, `discipline doc` and
# `discipline review checklist` also work when installed with uvx or uv tool install.
[tool.hatch.build.targets.wheel.force-include]
"agents" = "discipline/_plugin/agents"
"skills" = "discipline/_plugin/skills"

[tool.hatch.build.targets.sdist]
include = ["src/discipline", "agents", "skills", "tests", "README.md", "pyproject.toml"]
